name: Advanced Laminar Moderator

on:
  issues:
    types: [opened, edited]

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Moderator Bot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.LAMINAR_BOT_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const username = issue.user.login;
            const owner = context.repo.owner;
            const publicRepo = context.repo.repo;
            const privateLogRepo = "Laminar";
            
            try {
              const userProfile = await github.rest.users.getByUsername({ username: username });
              const createdAt = new Date(userProfile.data.created_at);
              const now = new Date();
              const diffTime = Math.abs(now - createdAt);
              const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
              
              const isLowAge = diffDays < 7;

              const body = (issue.body || "").toLowerCase();
              const title = (issue.title || "").toLowerCase();
              
              const blacklist = [
                "bitch", "fuck", "shitty", "trash", "useless", "dumb", "clown", "stupid",
                "anjing", "babi", "tolol", "goblok", "kontol", "ngentot", "memek", 
                "fitnah", "hoax", "bodoh", "cacat", "idiot", "sampah", "plagiat", "maling","ai slop","slop"
                "garbage", "pathetic", "plagiarism"
              ];
              
              let isToxic = false;
              for (const word of blacklist) {
                if (body.includes(word) || title.includes(word)) {
                  isToxic = true;
                  break;
                }
              }

              if (isLowAge || isToxic) {
                const reasonType = isLowAge ? "Low-Age Account" : "Violation";
                const logTitle = `[${reasonType}] @${username}`;
                
                const logBody = `### Offender Details\n* **User:** @${username}\n* **Account Age:** ${diffDays} days\n* **Reason:** ${reasonType}\n\n### Original Submission\n* **Title:** ${issue.title}\n\n* **Body:**\n\`\`\`\n${issue.body}\n\`\`\``;
                
                await github.rest.issues.create({
                  owner: owner,
                  repo: privateLogRepo,
                  title: logTitle,
                  body: logBody
                });

                const search = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${privateLogRepo} in:title "@${username}"`
                });
                const violationCount = search.data.total_count;

                if (violationCount >= 3) {
                  await github.rest.users.block({ username: username });
                  console.log(`Globally blocked @${username} due to ${violationCount} recorded violations.`);
                }

                const deleteMutation = `mutation($id: ID!) {
                  deleteIssue(input: {issueId: $id}) {
                    clientMutationId
                  }
                }`;
                
                await github.graphql(deleteMutation, { id: issue.node_id });
                console.log(`Successfully deleted public issue #${issue.number} and archived privately.`);
              }

            } catch (error) {
              console.error("Moderator Error:", error.message);
            }
